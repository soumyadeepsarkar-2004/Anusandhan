# ==============================================================================
# Anusandhan - Fly.io Application Manifest
# ==============================================================================
app = "anusandhan-pro"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile.unified"

[env]
  NODE_ENV = "production"
  PORT = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[mounts]
  source = "anusandhan_data"
  destination = "/app/server/db"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
