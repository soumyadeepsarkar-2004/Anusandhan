<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="postBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#postBg)" />

  <!-- Top Header Area -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2" />
    <text x="90" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#38BDF8" text-anchor="middle" letter-spacing="1">ANUSANDHAN v1.0</text>

    <text x="0" y="90" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff">Why 98% of Academic</text>
    <text x="0" y="150" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="52" fill="url(#headerGrad)">Cold Emails Get Deleted.</text>
    <text x="0" y="195" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#94A3B8">And how to write a 146-word precision pitch that professors actually read.</text>
  </g>

  <!-- Comparison Cards -->
  <!-- Card Left: The Old Way (Generic Spam) -->
  <g transform="translate(80, 320)" filter="url(#cardShadow)">
    <rect width="430" height="520" rx="20" fill="#111827" stroke="#EF4444" stroke-width="2" stroke-opacity="0.8" />
    
    <!-- Header -->
    <rect x="24" y="24" width="120" height="32" rx="16" fill="#450A0A" />
    <text x="84" y="45" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#F87171" text-anchor="middle">❌ THE WRONG WAY</text>

    <text x="24" y="100" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#FCA5A5">Generic Copy-Paste</text>
    
    <g transform="translate(24, 130)">
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="16" fill="#9CA3AF">• "Respected Sir, I am deeply impressed..."</text>
      <text x="0" y="55" font-family="'Inter', sans-serif" font-size="16" fill="#9CA3AF">• 500+ words of autobiography</text>
      <text x="0" y="90" font-family="'Inter', sans-serif" font-size="16" fill="#9CA3AF">• Generic resume attachment</text>
      <text x="0" y="125" font-family="'Inter', sans-serif" font-size="16" fill="#9CA3AF">• Zero paper citations</text>
      <text x="0" y="160" font-family="'Inter', sans-serif" font-size="16" fill="#9CA3AF">• Mass BCC blasting</text>
    </g>

    <!-- Stat Callout -->
    <rect x="24" y="380" width="382" height="100" rx="14" fill="#1F2937" />
    <text x="215" y="425" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#EF4444" text-anchor="middle">&lt; 2% Response Rate</text>
    <text x="215" y="455" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF" text-anchor="middle">Deleted or spam-filtered in 2 seconds</text>
  </g>

  <!-- Card Right: The Anusandhan Way -->
  <g transform="translate(570, 320)" filter="url(#cardShadow)">
    <rect width="430" height="520" rx="20" fill="#0C1A2E" stroke="#10B981" stroke-width="2.5" />
    
    <!-- Header -->
    <rect x="24" y="24" width="130" height="32" rx="16" fill="#064E3B" />
    <text x="89" y="45" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#34D399" text-anchor="middle">✅ ANUSANDHAN</text>

    <text x="24" y="100" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#6EE7B7">146-Word Precision</text>
    
    <g transform="translate(24, 130)">
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="16" fill="#D1D5DB">• Citations of their last 3 papers</text>
      <text x="0" y="55" font-family="'Inter', sans-serif" font-size="16" fill="#D1D5DB">• Specific methodology bridge</text>
      <text x="0" y="90" font-family="'Inter', sans-serif" font-size="16" fill="#D1D5DB">• Proof-of-work code repo link</text>
      <text x="0" y="125" font-family="'Inter', sans-serif" font-size="16" fill="#D1D5DB">• 5-Pillar RRS™ readiness badge</text>
      <text x="0" y="160" font-family="'Inter', sans-serif" font-size="16" fill="#D1D5DB">• Zero spam flattery</text>
    </g>

    <!-- Stat Callout -->
    <rect x="24" y="380" width="382" height="100" rx="14" fill="#06283D" stroke="#0284C7" stroke-width="1.2" />
    <text x="215" y="425" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#38BDF8" text-anchor="middle">&gt; 24% Response Rate</text>
    <text x="215" y="455" font-family="'Inter', sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle">High-signal, respected by top faculty</text>
  </g>

  <!-- Bottom CTA Footer -->
  <g transform="translate(80, 910)">
    <rect width="920" height="90" rx="20" fill="#0B132B" stroke="#334155" stroke-width="1.5" />
    <text x="40" y="55" font-family="'Inter', sans-serif" font-weight="800" font-size="24" fill="#ffffff">Explore Free &amp; Open Source:</text>
    <text x="410" y="55" font-family="'Inter', sans-serif" font-weight="800" font-size="24" fill="#38BDF8">anusandhan.vercel.app</text>
    
    <rect x="740" y="24" width="140" height="42" rx="21" fill="#10B981" />
    <text x="810" y="51" font-family="'Inter', sans-serif" font-weight="700" font-size="15" fill="#042F2C" text-anchor="middle">TRY NOW →</text>
  </g>
</svg>
