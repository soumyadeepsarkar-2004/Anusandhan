<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="storyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="35%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#09101F" />
      <stop offset="100%" stop-color="#04070D" />
    </linearGradient>
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#storyBg)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="540" cy="400" r="350" fill="#0284C7" opacity="0.12" filter="blur(60px)" />
  <circle cx="540" cy="1400" r="300" fill="#10B981" opacity="0.08" filter="blur(60px)" />

  <!-- Top Safe Zone Branding (y=260-340) -->
  <g transform="translate(100, 260)">
    <!-- Logo Monogram -->
    <rect width="64" height="64" rx="16" fill="url(#cyanPill)" />
    <path d="M 22 46 L 32 20 L 42 46 Z M 26 38 L 38 38" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linejoin="round" />
    <circle cx="32" cy="18" r="3.5" fill="#FFFFFF" />
    
    <text x="82" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5">ANUSANDHAN</text>
    <text x="82" y="58" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ACADEMIC RESEARCH AI</text>
  </g>

  <!-- Hook Badge -->
  <rect x="100" y="380" width="340" height="44" rx="22" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />
  <text x="270" y="408" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="2" text-anchor="middle">RESEARCH INTERNSHIP RADAR</text>

  <!-- Big Bold Question Hook -->
  <text x="100" y="490" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" line-height="1.2">
    Still cold emailing
  </text>
  <text x="100" y="555" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800">
    professors with
  </text>
  <text x="100" y="620" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800">
    "Respected Sir"? ❌
  </text>

  <!-- Main Content Card -->
  <rect x="100" y="680" width="880" height="380" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" />
  
  <text x="145" y="745" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="1">THE REALITY AT CERN, MPI &amp; IISC:</text>
  
  <text x="145" y="805" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">
    Top labs get 200+ spam templates daily.
  </text>
  <text x="145" y="845" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    They delete emails &gt;300 words in 2 seconds.
  </text>

  <line x1="145" y1="885" x2="935" y2="885" stroke="#334155" stroke-width="1.5" />

  <text x="145" y="935" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
    WHAT GETS REPLIES:
  </text>
  <text x="145" y="975" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700">
    A 146-word precision pitch citing their
  </text>
  <text x="145" y="1015" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700">
    last publication &amp; reproducible code.
  </text>

  <!-- Interactive Sticker Simulation (y=1110 - 1380) -->
  <rect x="100" y="1110" width="880" height="280" rx="28" fill="#131C2E" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 6" />
  <text x="540" y="1165" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="2" text-anchor="middle">TAP TO VOTE ON OUR STORY POLL 👇</text>

  <!-- Poll Option A -->
  <rect x="145" y="1195" width="790" height="70" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <text x="180" y="1238" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">A. Guilty 😭 (Still using templates)</text>

  <!-- Poll Option B -->
  <rect x="145" y="1285" width="790" height="70" rx="16" fill="#064E3B" stroke="#10B981" stroke-width="2" />
  <text x="180" y="1328" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">B. Ready for the 146-word formula ⚡</text>

  <!-- CTA Box (y=1440 - 1620) -->
  <rect x="100" y="1440" width="880" height="150" rx="24" fill="url(#cyanPill)" />
  <text x="540" y="1500" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle">
    FREE OPEN-SOURCE RESEARCH TOOL
  </text>
  <text x="540" y="1545" fill="#E0F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    Tap Link in Bio • anusandhan.vercel.app 🔗
  </text>

  <!-- Safe Zone Bottom Handle (y=1660) -->
  <text x="540" y="1660" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    @anusandhan.ai • Anusandhan Platform
  </text>
</svg>
