<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <radialGradient id="twGlow" cx="75%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0E243A" />
      <stop offset="60%" stop-color="#080E1A" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#twGlow)" />

  <!-- Abstract Geometry & Tech Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1500" y2="100" />
    <line x1="0" y1="200" x2="1500" y2="200" />
    <line x1="0" y1="300" x2="1500" y2="300" />
    <line x1="0" y1="400" x2="1500" y2="400" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
    <line x1="1000" y1="0" x2="1000" y2="500" />
    <line x1="1250" y1="0" x2="1250" y2="500" />
  </g>

  <!-- Right Visual: The 5-Pillar RRS Radar Graphic -->
  <g transform="translate(1180, 250)">
    <!-- Pentagon Outer -->
    <polygon points="0,-140 133,-43 82,113 -82,113 -133,-43" fill="none" stroke="#1E293B" stroke-width="2" />
    <polygon points="0,-95 90,-29 55,76 -55,76 -90,-29" fill="none" stroke="#0E7490" stroke-width="1.5" />
    <!-- Active Radar Fill -->
    <polygon points="0,-125 105,-35 45,95 -68,90 -115,-38" fill="#06B6D4" fill-opacity="0.18" stroke="url(#twGrad)" stroke-width="3" filter="url(#softGlow)" />
    <!-- Radar Nodes -->
    <circle cx="0" cy="-125" r="5" fill="#38BDF8" />
    <circle cx="105" cy="-35" r="5" fill="#34D399" />
    <circle cx="45" cy="95" r="5" fill="#818CF8" />
    <circle cx="-68" cy="90" r="5" fill="#FBBF24" />
    <circle cx="-115" cy="-38" r="5" fill="#F43F5E" />
    <text x="0" y="160" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="2">RRS™ 5-PILLAR RADAR</text>
  </g>

  <!-- Left Main Content -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#0F172A" stroke="#0284C7" stroke-width="1.2" />
    <text x="110" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">OFFICIAL PLATFORM</text>

    <text x="0" y="90" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="58" fill="#ffffff" letter-spacing="2">Anusandhan</text>
    <text x="400" y="90" font-family="'Noto Sans Devanagari', sans-serif" font-weight="700" font-size="40" fill="#06B6D4">| अनुसंधान</text>

    <text x="0" y="145" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="24" fill="#E2E8F0">Autonomous Academic Research Intelligence</text>
    <text x="0" y="185" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">Land funded internships at DAAD, CERN, Mitacs &amp; IISc without generic cold-email spam.</text>

    <g transform="translate(0, 230)">
      <text x="0" y="0" font-family="'Inter', monospace" font-size="16" fill="#38BDF8">🌐 anusandhan.vercel.app</text>
      <text x="290" y="0" font-family="'Inter', monospace" font-size="16" fill="#34D399">⚡ 146-Word Precision Pitches</text>
      <text x="590" y="0" font-family="'Inter', monospace" font-size="16" fill="#FBBF24">⭐ 100% Open Source</text>
    </g>
  </g>
</svg>
