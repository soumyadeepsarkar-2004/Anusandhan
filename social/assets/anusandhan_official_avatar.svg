<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="60%" stop-color="#08101e" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="goldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGlow)" />

  <!-- Subtle Concentric Radar Rings -->
  <circle cx="540" cy="460" r="380" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="540" cy="460" r="300" fill="none" stroke="#0E7490" stroke-width="2" opacity="0.4"/>
  <circle cx="540" cy="460" r="220" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="10,10" opacity="0.5"/>
  <circle cx="540" cy="460" r="140" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>

  <!-- Orbital Scanning Nodes -->
  <circle cx="760" cy="460" r="8" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="320" cy="460" r="8" fill="#10B981" filter="url(#glow)"/>
  <circle cx="540" cy="240" r="8" fill="#3B82F6" filter="url(#glow)"/>
  <circle cx="540" cy="680" r="8" fill="#F59E0B" filter="url(#glow)"/>

  <!-- Central Scientific Monogram (Geometric 'A' + 'अनुसंधान' Core) -->
  <g transform="translate(540, 460)">
    <!-- Hexagonal Quantum Shield -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="#0b172a" stroke="url(#cyanEmerald)" stroke-width="5" filter="url(#glow)" />
    <!-- Center Core Emblem -->
    <path d="M 0,-85 L 65,55 L 35,55 L 18,15 L -18,15 L -35,55 L -65,55 Z M 0,-40 L -12,0 L 12,0 Z" fill="url(#cyanEmerald)" />
    <!-- Focal Photon Point -->
    <circle cx="0" cy="-5" r="7" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Typography Brand Header -->
  <text x="540" y="760" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="8">ANUSANDHAN</text>
  <text x="540" y="825" font-family="'Noto Sans Devanagari', 'Inter', sans-serif" font-weight="700" font-size="44" fill="#06B6D4" text-anchor="middle" letter-spacing="4">अनुसंधान</text>
  <text x="540" y="885" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="24" fill="#94A3B8" text-anchor="middle" letter-spacing="3">ACADEMIC RESEARCH INTELLIGENCE</text>

  <!-- Verified Badge Pill -->
  <rect x="420" y="930" width="240" height="42" rx="21" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
  <circle cx="446" cy="951" r="7" fill="#10B981" />
  <text x="545" y="959" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">100% OPEN SOURCE</text>
</svg>
