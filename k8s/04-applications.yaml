apiVersion: apps/v1
kind: Deployment
metadata:
  name: anusandhan-gateway
  namespace: anusandhan-production
  labels:
    app: anusandhan-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: anusandhan-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: anusandhan-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/anusandhan/anusandhan-gateway:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: anusandhan-config
            - secretRef:
                name: anusandhan-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: anusandhan-production
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: anusandhan-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anusandhan-ai-microservice
  namespace: anusandhan-production
  labels:
    app: anusandhan-ai-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anusandhan-ai-microservice
  template:
    metadata:
      labels:
        app: anusandhan-ai-microservice
    spec:
      containers:
        - name: ai-microservice
          image: ghcr.io/anusandhan/anusandhan-ai:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: anusandhan-config
            - secretRef:
                name: anusandhan-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-microservice-service
  namespace: anusandhan-production
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: anusandhan-ai-microservice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anusandhan-frontend
  namespace: anusandhan-production
  labels:
    app: anusandhan-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anusandhan-frontend
  template:
    metadata:
      labels:
        app: anusandhan-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/anusandhan/anusandhan-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: anusandhan-production
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: anusandhan-frontend
