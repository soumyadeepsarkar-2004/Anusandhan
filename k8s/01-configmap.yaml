apiVersion: v1
kind: ConfigMap
metadata:
  name: anusandhan-config
  namespace: anusandhan-production
  labels:
    app.kubernetes.io/name: anusandhan
data:
  NODE_ENV: "production"
  PORT: "5000"
  AI_PORT: "8000"
  PYTHON_SERVICE_URL: "http://ai-microservice-service:8000/api/v1"
  REDIS_URL: "redis://redis-service:6379"
  DATABASE_URL: "postgres://anusandhan_user:anusandhan_secure_password_2026@postgres-service:5432/anusandhan_db"
  MONGODB_URI: "mongodb://mongo-service:27017/anusandhan_db"
  SCRAPE_INTERVAL_MS: "1800000"
  ALLOWED_ORIGINS: "https://anusandhan.ai,https://www.anusandhan.ai"
  TRUST_PROXY: "true"
