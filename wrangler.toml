# ==============================================================================
# Anusandhan - Cloudflare Workers & Pages Edge Configuration
# ==============================================================================
name = "anusandhan-gateway"
main = "server/cloudflare-worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
PORT = "5000"

[site]
bucket = "./dist"

[env.production]
name = "anusandhan-production"
routes = [
  { pattern = "anusandhan.vercel.app/api/*", zone_name = "anusandhan.vercel.app" }
]
