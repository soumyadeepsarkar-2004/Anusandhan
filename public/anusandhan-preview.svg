<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>
    <linearGradient id="window-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D2A" />
      <stop offset="100%" stop-color="#0F131D" />
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2433" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#131722" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="badge-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="window-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="5" stdDeviation="15" flood-color="#F59E0B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="1280" height="720" fill="url(#bg-canvas)" />
  <circle cx="200" cy="150" r="300" fill="#F59E0B" opacity="0.05" filter="blur(80px)" />
  <circle cx="1080" cy="500" r="280" fill="#3B82F6" opacity="0.04" filter="blur(80px)" />

  <!-- macOS Window Container -->
  <g transform="translate(40, 25)" filter="url(#window-shadow)">
    <!-- Window Outer Shell -->
    <rect width="1200" height="670" rx="18" fill="url(#window-frame)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" />

    <!-- Window Titlebar -->
    <path d="M 0 18 Q 0 0 18 0 L 1182 0 Q 1200 0 1200 18 L 1200 48 L 0 48 Z" fill="#131722" />
    <line x1="0" y1="48" x2="1200" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- macOS Traffic Light Window Buttons -->
    <circle cx="26" cy="24" r="6.5" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5" />
    <circle cx="46" cy="24" r="6.5" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5" />
    <circle cx="66" cy="24" r="6.5" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5" />

    <!-- Browser Address Pill -->
    <rect x="360" y="11" width="480" height="26" rx="13" fill="#0B0E15" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <g transform="translate(375, 17)">
      <path d="M4 10a4 4 0 1 1 8 0v2H4v-2zm2-2a2 2 0 1 1 4 0v2H6V8z" fill="#10B981" />
      <text x="22" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8" font-weight="500">
        https://anusandhan.ai/workspace/opportunities
      </text>
      <circle cx="430" cy="7" r="3.5" fill="#10B981" />
    </g>

    <!-- Top App Navigation Bar -->
    <g transform="translate(24, 62)">
