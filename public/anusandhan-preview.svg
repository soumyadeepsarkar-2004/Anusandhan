        <rect x="-8" y="-6" width="94" height="26" rx="13" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" />
        <text x="6" y="11" fill="#FBBF24" font-weight="600">Opportunities</text>
