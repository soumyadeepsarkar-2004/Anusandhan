<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C"/>
      <stop offset="50%" stop-color="#0F121C"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>

    <radialGradient id="amberAura" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanAura" cx="15%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#0369A1" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Fill -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2130" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0E121A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="amberBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#amberAura)"/>
  <rect width="1200" height="675" fill="url(#cyanAura)"/>

  <!-- Subtle Constellation Nodes & Connecting Filaments -->
  <g opacity="0.25" stroke="#F59E0B" stroke-width="0.75">
    <line x1="80" y1="120" x2="220" y2="70"/>
    <line x1="220" y1="70" x2="350" y2="160"/>
    <line x1="350" y1="160" x2="520" y2="90"/>
    <line x1="900" y1="110" x2="1050" y2="170"/>
    <line x1="1050" y1="170" x2="1140" y2="90"/>
    <circle cx="80" cy="120" r="3" fill="#F59E0B"/>
    <circle cx="220" cy="70" r="2.5" fill="#38BDF8"/>
    <circle cx="350" cy="160" r="3" fill="#F59E0B"/>
    <circle cx="520" cy="90" r="2" fill="#FFFFFF"/>
    <circle cx="900" cy="110" r="2.5" fill="#F59E0B"/>
    <circle cx="1050" cy="170" r="3.5" fill="#38BDF8"/>
    <circle cx="1140" cy="90" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Browser Container Window -->
  <g transform="translate(60, 40)" filter="url(#softShadow)">
    <!-- Window Frame -->
    <rect width="1080" height="595" rx="20" fill="#0C0E14" stroke="#262D3D" stroke-width="1.5"/>
    
    <!-- Window Title Bar -->
    <rect width="1080" height="42" rx="20" fill="#141824"/>
    <rect y="24" width="1080" height="18" fill="#141824"/>
    <line x1="0" y1="42" x2="1080" y2="42" stroke="#222838" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="21" r="5" fill="#10B981"/>
    
    <!-- URL Pill -->
    <rect x="360" y="9" width="360" height="24" rx="12" fill="#090B10" stroke="#1F2533" stroke-width="1"/>
    <text x="540" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">
      https://cab-pdf-camping-navigator.trycloudflare.com
    </text>

    <!-- App Inner Viewport -->
    <g transform="translate(0, 42)">
      <!-- Navbar Floating Island -->
      <g transform="translate(90, 16)">
        <rect width="900" height="46" rx="23" fill="#121622" stroke="#2D3548" stroke-width="1" opacity="0.95"/>
        
        <!-- Brand Logo Icon & Text -->
        <g transform="translate(18, 11)">
          <rect width="24" height="24" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
          <text x="12" y="16" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="13" fill="#F59E0B">अ</text>
          <text x="34" y="17" font-family="Georgia, serif" font-weight="bold" font-size="15" fill="#F1F5F9">Anusandhan</text>
        </g>

        <!-- Nav Links -->
        <g transform="translate(260, 28)" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">
          <text x="0" y="0" fill="#F59E0B" font-weight="bold">Opportunities</text>
          <text x="120" y="0">How It Works</text>
          <text x="240" y="0">Fellowships</text>
          <text x="350" y="0">Plans</text>
          <text x="430" y="0">Docs ↗</text>
        </g>

        <!-- Launch Platform CTA Pill -->
        <g transform="translate(735, 7)">
          <rect width="150" height="32" rx="16" fill="url(#amberBtn)"/>
          <text x="75" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#090B10">
            Launch Platform →
          </text>
        </g>
      </g>

      <!-- Hero Header Text -->
      <g transform="translate(540, 105)" text-anchor="middle">
        <!-- Live Badge -->
        <rect x="-140" y="0" width="280" height="24" rx="12" fill="#1E2433" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="-118" cy="12" r="3.5" fill="#10B981"/>
        <text x="5" y="16" font-family="monospace" font-size="10.5" fill="#FBBF24" letter-spacing="0.5">
          24/7 AUTONOMOUS ACADEMIC RADAR
        </text>

        <!-- Main Title -->
        <text y="58" font-family="Georgia, serif" font-weight="bold" font-size="30" fill="#F8FAFC" letter-spacing="-0.5">
          Democratizing Global Research Lab Admissions
        </text>
        <text y="84" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">
          Literature-grounded 146-word cold pitches, real-time RRS diagnostic scoring, and verified faculty matching.
        </text>
      </g>

      <!-- 3-Column Feature Cards Grid -->
      <g transform="translate(50, 230)">
        <!-- Card 1: Verified Faculty Match -->
        <g transform="translate(0, 0)">
          <rect width="310" height="275" rx="16" fill="url(#glassFill)" stroke="#2A3347" stroke-width="1"/>
          <!-- Top Tag -->
          <rect x="18" y="18" width="100" height="20" rx="10" fill="#10B981" fill-opacity="0.15"/>
          <text x="68" y="32" text-anchor="middle" font-family="monospace" font-size="10" fill="#34D399" font-weight="bold">94% MATCH</text>
          
          <text x="18" y="68" font-family="-apple-system, sans-serif" font-weight="bold" font-size="16" fill="#F1F5F9">Prof. Aris Thorne</text>
          <text x="18" y="88" font-family="-apple-system, sans-serif" font-size="11.5" fill="#38BDF8">Indian Institute of Science (IISc)</text>
          <text x="18" y="105" font-family="monospace" font-size="10" fill="#64748B">Distributed Attention &amp; Quantum ML</text>
          
          <!-- Recent Paper Citation -->
          <rect x="18" y="125" width="274" height="60" rx="8" fill="#0C0E16" stroke="#1E2536" stroke-width="1"/>
          <text x="28" y="145" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0" font-weight="bold">Recent ArXiv Publication (2026):</text>
          <text x="28" y="162" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">"Scalable FlashAttention on Heterogeneous Clusters"</text>
          
          <!-- Card Action Button -->
          <rect x="18" y="210" width="274" height="34" rx="8" fill="#1E2538" stroke="#374151" stroke-width="1"/>
          <text x="155" y="231" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#F59E0B" font-weight="bold">
            Draft 146-Word Pitch ⚡
          </text>
        </g>

        <!-- Card 2: 146-Word Precision Pitch Composer -->
        <g transform="translate(335, 0)">
          <rect width="310" height="275" rx="16" fill="url(#glassFill)" stroke="#2A3347" stroke-width="1"/>
          <rect x="18" y="18" width="130" height="20" rx="10" fill="#F59E0B" fill-opacity="0.15"/>
          <text x="83" y="32" text-anchor="middle" font-family="monospace" font-size="10" fill="#FBBF24" font-weight="bold">146-WORD ENGINE</text>
          
          <text x="18" y="68" font-family="-apple-system, sans-serif" font-weight="bold" font-size="16" fill="#F1F5F9">Targeted Cold Pitch</text>
          <text x="18" y="88" font-family="monospace" font-size="10.5" fill="#10B981">Word Count: 142 / 146 max</text>
          
          <!-- Email Preview Snippet -->
          <rect x="18" y="105" width="274" height="100" rx="8" fill="#0C0E16" stroke="#1E2536" stroke-width="1"/>
          <text x="28" y="125" font-family="monospace" font-size="9" fill="#94A3B8">Subject: Inquiry on FlashAttention Scaling</text>
          <text x="28" y="145" font-family="-apple-system, sans-serif" font-size="9" fill="#CBD5E1">Dear Prof. Thorne, I reproduced your recent</text>
          <text x="28" y="160" font-family="-apple-system, sans-serif" font-size="9" fill="#CBD5E1">benchmarks on 4x RTX 4090s and reduced</text>
          <text x="28" y="175" font-family="-apple-system, sans-serif" font-size="9" fill="#CBD5E1">gradient sync latency by 18% via kernel fusion...</text>

          <rect x="18" y="220" width="274" height="34" rx="8" fill="url(#amberBtn)"/>
          <text x="155" y="241" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#090B10" font-weight="bold">
            Send Ethical Outreach →
          </text>
        </g>

        <!-- Card 3: Research Readiness Score Diagnostic -->
        <g transform="translate(670, 0)">
          <rect width="310" height="275" rx="16" fill="url(#glassFill)" stroke="#2A3347" stroke-width="1"/>
          <rect x="18" y="18" width="125" height="20" rx="10" fill="#38BDF8" fill-opacity="0.15"/>
          <text x="80" y="32" text-anchor="middle" font-family="monospace" font-size="10" fill="#38BDF8" font-weight="bold">RRS DIAGNOSTIC</text>

          <text x="18" y="68" font-family="-apple-system, sans-serif" font-weight="bold" font-size="16" fill="#F1F5F9">Score: 94 / 100</text>
          <text x="18" y="88" font-family="monospace" font-size="10.5" fill="#34D399">Tier: Elite Candidate</text>

          <!-- Diagnostic Dimension Bars -->
          <g transform="translate(18, 110)">
            <text x="0" y="10" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Paper Deconstruction</text>
            <rect x="130" y="2" width="144" height="8" rx="4" fill="#1E2536"/>
            <rect x="130" y="2" width="138" height="8" rx="4" fill="#10B981"/>

            <text x="0" y="30" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Code Reproduction</text>
            <rect x="130" y="22" width="144" height="8" rx="4" fill="#1E2536"/>
            <rect x="130" y="22" width="130" height="8" rx="4" fill="#F59E0B"/>

            <text x="0" y="50" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Email Ethics Pacing</text>
            <rect x="130" y="42" width="144" height="8" rx="4" fill="#1E2536"/>
            <rect x="130" y="42" width="144" height="8" rx="4" fill="#10B981"/>

            <text x="0" y="70" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Oral Viva Readiness</text>
            <rect x="130" y="62" width="144" height="8" rx="4" fill="#1E2536"/>
            <rect x="130" y="62" width="124" height="8" rx="4" fill="#38BDF8"/>
          </g>

          <rect x="18" y="220" width="274" height="34" rx="8" fill="#1E2538" stroke="#374151" stroke-width="1"/>
          <text x="155" y="241" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#38BDF8" font-weight="bold">
            Simulate Mock Technical Viva 🎙
          </text>
        </g>
      </g>

    </g>
  </g>
</svg>
