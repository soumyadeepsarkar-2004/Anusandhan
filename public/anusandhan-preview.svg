      <g transform="translate(0, 4)">
        <polygon points="14,0 28,8 28,24 14,32 0,24 0,8" fill="none" stroke="#F59E0B" stroke-width="2" />
        <circle cx="14" cy="16" r="4.5" fill="#FBBF24" />
      </g>
      <text x="38" y="22" font-family="Georgia, serif" font-size="17" fill="#F3F4F6" font-weight="bold">
        अनुसंधान <tspan fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Anusandhan</tspan>
      </text>

