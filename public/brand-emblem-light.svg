<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crisp Sapphire & Pearl Radial Gradient -->
    <radialGradient id="lightBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#F1F5F9" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="1"/>
    </radialGradient>

    <!-- Deep Royal Sapphire Gradient -->
    <linearGradient id="sapphireFilament" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Imperial Gold Gradient -->
    <linearGradient id="imperialGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Specular Node Glow Filter -->
    <filter id="lightSubtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base: Polished Pearl Crystal Shield -->
  <rect width="500" height="500" rx="44" fill="url(#lightBgGlow)"/>
  <rect x="2" y="2" width="496" height="496" rx="42" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="6" y="6" width="488" height="488" rx="38" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Orbital Ellipses (Constellation Astrolabe Geometry) -->
  <g transform="translate(250, 250)">
    <!-- Outer Octagonal Boundary -->
    <polygon points="0,-190 134,-134 190,0 134,134 0,190 -134,134 -190,0 -134,-134" 
             stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>

    <!-- Orbital Ring 1: 0 deg (Deep Sapphire) -->
    <ellipse cx="0" cy="0" rx="160" ry="60" stroke="#0284C7" stroke-width="2" stroke-opacity="0.75" fill="none"/>
    
    <!-- Orbital Ring 2: 60 deg (Imperial Gold) -->
    <ellipse cx="0" cy="0" rx="160" ry="60" stroke="url(#imperialGold)" stroke-width="2.2" stroke-opacity="0.9" fill="none" transform="rotate(60)"/>
    
    <!-- Orbital Ring 3: 120 deg (Deep Slate Navy) -->
    <ellipse cx="0" cy="0" rx="160" ry="60" stroke="url(#sapphireFilament)" stroke-width="2.2" fill="none" transform="rotate(120)"/>

    <!-- Central Precision Diamond Nucleus (Royal Sapphire & Obsidian) -->
    <polygon points="0,-36 36,0 0,36 -36,0" fill="#0F172A" stroke="#D97706" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="url(#sapphireFilament)" filter="url(#lightSubtleGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>

    <!-- Academic Laurel / Quill Filaments -->
    <path d="M -90,110 C -130,50 -130,-40 -70,-110 C -75,-60 -70,20 -30,70 Z" 
          fill="#0284C7" fill-opacity="0.12" stroke="#0369A1" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M 90,110 C 130,50 130,-40 70,-110 C 75,-60 70,20 30,70 Z" 
          fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Research Lab Nodes with Crisp High Contrast -->
    <!-- Node 1: Top -->
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="0" cy="-160" r="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="0" cy="-160" r="3.5" fill="#D97706"/>

    <!-- Node 2: Top Right (60 deg) -->
    <circle cx="138" cy="-80" r="7" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <circle cx="138" cy="-80" r="3" fill="#0F172A"/>

    <!-- Node 3: Bottom Right (120 deg) -->
    <circle cx="138" cy="80" r="7" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <circle cx="138" cy="80" r="3" fill="#0284C7"/>

    <!-- Node 4: Bottom -->
    <line x1="0" y1="0" x2="0" y2="160" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="0" cy="160" r="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/>
    <circle cx="0" cy="160" r="3.5" fill="#0F172A"/>

    <!-- Node 5: Bottom Left (240 deg) -->
    <circle cx="-138" cy="80" r="7" fill="#FFFFFF" stroke="#0369A1" stroke-width="2"/>
    <circle cx="-138" cy="80" r="3" fill="#D97706"/>

    <!-- Node 6: Top Left (300 deg) -->
    <circle cx="-138" cy="-80" r="7" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <circle cx="-138" cy="-80" r="3" fill="#0F172A"/>
  </g>
</svg>