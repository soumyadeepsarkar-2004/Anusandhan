name: Anusandhan Production CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript & Build Static Assets
        run: npm run build

      - name: Upload Production Static Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anusandhan-frontend-dist
          path: dist/
          retention-days: 7

  gateway-test:
    name: Node.js Express Gateway Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gateway Dependencies
        run: |
          cd server
          npm ci

      - name: Prepare Test Environment
        run: |
          cd server
          cp .env.example .env 2>/dev/null || :

      - name: Run Gateway Automated Test Suite
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: test_jwt_secret_for_ci_cd_32chars_long_entropy
          RAZORPAY_KEY_ID: rzp_test_dummy
          RAZORPAY_KEY_SECRET: rzp_test_secret_dummy

  python-microservice-test:
    name: Python AI Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        run: |
          cd backend
          pytest tests/ -v
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          GEMINI_API_KEY: test_dummy_gemini_key_for_ci
          JWT_SECRET: test_jwt_secret_for_ci_cd_32chars_long_entropy

