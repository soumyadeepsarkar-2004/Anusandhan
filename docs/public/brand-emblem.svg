<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dark Luxury Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2330" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0E1118" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#08090C" stop-opacity="1"/>
    </radialGradient>

    <!-- Warm Amber Filament Gradient -->
    <linearGradient id="amberFilament" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Platinum Slate Gradient -->
    <linearGradient id="slateRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="40" fill="#090A0E"/>
  <rect x="2" y="2" width="496" height="496" rx="38" stroke="#27272A" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="220" fill="url(#bgGlow)"/>

  <!-- Orbital Ellipses (Constellation Geometry) -->
  <g transform="translate(250, 250)">
    <!-- Outer Octagonal Boundary -->
    <polygon points="0,-190 134,-134 190,0 134,134 0,190 -134,134 -190,0 -134,-134" 
             stroke="#3F3F46" stroke-width="1" stroke-dasharray="3 6" fill="none"/>

    <!-- Orbital Ring 1: 0 deg -->
    <ellipse cx="0" cy="0" rx="160" ry="60" stroke="#52525B" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
    
    <!-- Orbital Ring 2: 60 deg -->
    <ellipse cx="0" cy="0" rx="160" ry="60" stroke="url(#slateRing)" stroke-width="1.5" stroke-opacity="0.6" fill="none" transform="rotate(60)"/>
    
    <!-- Orbital Ring 3: 120 deg -->
    <ellipse cx="0" cy="0" rx="160" ry="60" stroke="url(#amberFilament)" stroke-width="1.8" fill="none" transform="rotate(120)"/>

    <!-- Central Precision Diamond Nucleus -->
    <polygon points="0,-36 36,0 0,36 -36,0" fill="#18181B" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="url(#amberFilament)" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>

    <!-- Academic Laurel / Quill Filaments (Subtle Stylized Curves) -->
    <path d="M -90,110 C -130,50 -130,-40 -70,-110 C -75,-60 -70,20 -30,70 Z" 
          fill="#D97706" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.6"/>
    <path d="M 90,110 C 130,50 130,-40 70,-110 C 75,-60 70,20 30,70 Z" 
          fill="#D97706" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Research Lab Nodes (TUM, ETH, CERN, MIT, Max Planck, Oxford) -->
    <!-- Node 1: Top -->
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#71717A" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="0" cy="-160" r="7" fill="#18181B" stroke="#E5E7EB" stroke-width="2"/>
    <circle cx="0" cy="-160" r="2.5" fill="#F59E0B"/>

    <!-- Node 2: Top Right (60 deg) -->
    <circle cx="138" cy="-80" r="6" fill="#18181B" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="138" cy="-80" r="2" fill="#FFFFFF"/>

    <!-- Node 3: Bottom Right (120 deg) -->
    <circle cx="138" cy="80" r="6" fill="#18181B" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="138" cy="80" r="2" fill="#F59E0B"/>

    <!-- Node 4: Bottom -->
    <line x1="0" y1="0" x2="0" y2="160" stroke="#71717A" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="0" cy="160" r="7" fill="#18181B" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="0" cy="160" r="2.5" fill="#FFFFFF"/>

    <!-- Node 5: Bottom Left (240 deg) -->
    <circle cx="-138" cy="80" r="6" fill="#18181B" stroke="#71717A" stroke-width="1.5"/>
    <circle cx="-138" cy="80" r="2" fill="#E5E7EB"/>

    <!-- Node 6: Top Left (300 deg) -->
    <circle cx="-138" cy="-80" r="6" fill="#18181B" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="-138" cy="-80" r="2" fill="#FFFFFF"/>
  </g>
</svg>
